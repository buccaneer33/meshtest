
<ng-template #form_modal let-modal>
	<div class="modal-header">
		<h4 class="modal-title" id="modal-basic-title">Add</h4>
		<button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
      <span aria-hidden="true">&times;</span>
    </button>
	</div>
	<div class="modal-body">
		<form [formGroup]="mainFormGroup">
      <div class="form-group row">
        <div class="col-sm-5">
          <label for="itemName">Name</label>
          <app-string-input id="itemName" formControlName="name" />
        </div>
      </div>
      <div class="form-group row">
        <div class="col-sm-5">
          <label for="itemDesc">Description</label>
          <app-textarea-input id="itemDesc" formControlName="description" />
        </div>
      </div>
      <div class="form-group row">
        <div class="col-sm-5">
          <label for="itemPr">Price</label>
          <app-number-input id="itemPr" formControlName="price" />
        </div>
      </div>
      <div class="form-group row">
        <div class="col-sm-5">
          <label for="itemPr">Category</label>
          <app-string-input id="itemPr" formControlName="category" />
        </div>
      </div>
      <div class="form-group row">
        <div class="col-sm-5">
          <label for="itembrand">Brand</label>
          <app-string-input id="itembrand" formControlName="brand" />
        </div>
      </div>
		</form>
	</div>
	<div class="modal-footer">
		<button type="button" class="btn btn-outline-secondary" (click)="modal.close('Save click')">Save</button>
	</div>
</ng-template>
